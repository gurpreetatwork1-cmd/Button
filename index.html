<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAS Kitchens</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .btn {
            display: inline-block;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            color: white;
            background-color: #007bff;
            border-radius: 10px;
            transition: background-color 0.3s ease;
            text-align: center;
        }

        .btn:hover,
        .btn:active {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <a href="https://paskitchens.in" class="btn" target="_blank">
        Visit PAS Kitchens
    </a>

</body>
</html>
